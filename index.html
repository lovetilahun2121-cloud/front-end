
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E Store - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
   <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>
</head>
    <body>
        <header>
            <h2>Tilahun-online shoping</h2>
            <div class="search-container">
                <input type="text" id="search-input" 
                placeholder="Search products..." oninput="searchproducts()">
                <i class="fas fa-search"></i>

            </div>


            <button class="cart-btn" onclick="toggleCart()">
                Cart (<span id="cart-count">0</span>)
            </button>
        </header>

        <nav class="category-filter">
            <button class="category-btn active"
                    data-category="all">All</button>

            <button class="category-btn"
                    data-category="electronics">
                Electronics
            </button>

            <button class="category-btn"
                    data-category="fashion">Fashion</button>

            <button class="category-btn"
                    data-category="home">Home</button>

            <button class="category-btn"
                    data-category="sports">Sports</button>
        </nav>

        <div class="products-container"
             id="products-container"></div>
             <div class="cart-sidebar" id="cart-sidebar"> 
                <h3>your cart</h3>
                <div class="cart-item" id="cart-item"> </div>
                <div class="cart-total"> 
                    <h4>Total:$<span id="cart-total">0.00 </span></h4>
                   <button class="checkout-btn" onclick="showPaymentModal()">checkout</button>

                </div>
            
             </div>
             <div class="payment-modal" id="payment-modal">
                <div class="payment-content">
                    <span class="close-btn" onclick="closePaymentModal()">&times;</span>
                    <h3>Payment</h3>

                    <div class="payment-methods">
                        <button class="payment-method active" data-method="credit-card">
                            <i class="fas fa-credit-card"></i> Credit Card
                            
                            </button>
                            <button class="payment-method" data-method="paypal">
                                <i class="fab fa-paypal"></i> PayPal
                                </button>
                                <button class="payment-method" data-method="crypto">
                                    <i class="fas fa-coins"></i> crypto
                                </button>

                            </div>
<form id="payment-form" onsubmit="processPayment(event)">
 <div class="form-group" >
     <label> Card Number</label>
     <input
      type="text"
      patttern="\d"
     minlength="16"
      maxlength="16"
     required

      />

    </div>
         <div class="form-row">
            <div class="form-group">
                <label>Expiration Date</label>
                <input type="month"
                 required
                 />
                
                </div class="form-group">
                    <label>CVV</label>
                    <input type="text"
                     pattern="\d{3}""
                     required
                     />
                     
                   </div>
             </div>
           <div class="form-group">
            <label>Cardholder Name</label>
            <input type="text"
             required
             />
             </div>
             <button type="submit" class="pay-now-btn">
                <i class="fas fa-lock"></i> Pay $<span id="payment-total">0</span>
             </button>
 </form>
    
  <div class="payment-processing" id="payment-processing">
<div class="spinner"></div>
  <P>processing payment</P>      
   </div> 
   <div class="payment-success" id="payment-success">
    <i class="fas fa-check-circle"></i>
    <h3>Payment Successful!</h3>
    <p>Thank you for your purchase.</p>

   </div>
</div>

        <script src="script.js"></script>
    </body>
</html>
